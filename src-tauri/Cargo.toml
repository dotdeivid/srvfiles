[package]
name = "srvfiles"
version = "1.0.0"
description = "SrvFiles — Compartí archivos en tu red local"
authors = []
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "srvfiles_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
