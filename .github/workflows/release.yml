name: Release

on:
  push:
    tags: ['v*']  # Se activa solo cuando pusheás un tag como v1.0.0

# Permisos necesarios para crear la Release en el repo
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false  # Si falla una plataforma, las demás siguen
      matrix:
        include:
          # Linux (runner más barato — 1x)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Windows (2x)
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          # macOS (Apple Silicon)
          - platform: macos-latest
            target: aarch64-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Solo Linux necesita librerías extra del sistema para compilar Tauri
      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install dependencies
        run: npm run install:all

      # No publicar nada que no pase los tests.
      - name: Backend tests
        working-directory: backend
        run: go test ./...

      - name: Frontend typecheck and tests
        working-directory: frontend
        run: npm run typecheck && npm test

      # tauri-action llama a `beforeBuildCommand` (npm run build:sidecar) que:
      #   1. Compila el frontend con Vite
      #   2. Embebe el dist en el binario Go
      #   3. Compila el sidecar Go con `go build -tags embed -ldflags="-s -w"`
      # Luego tauri-action compila Tauri y publica los instaladores en la Release.
      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Firma y notarización en macOS: se activan solas si los secretos existen.
          # Sin firmar, Gatekeeper (macOS) y SmartScreen (Windows) advierten al instalar.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Actualizador automático: firma de los paquetes de actualización.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SrvFiles ${{ github.ref_name }}'
          releaseBody: 'Descargá el instalador para tu plataforma.'
          releaseDraft: false
          prerelease: false
          # Con la clave de firma cargada se generan los paquetes de
          # actualización y latest.json; sin ella, el release sale igual.
          args: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' && '--config src-tauri/tauri.updater.conf.json' || '' }}
