name: Release

on:
  push:
    tags: ['v*']  # Se activa solo cuando pusheás un tag como v1.0.0

# Permisos necesarios para crear la Release en el repo
# (requerido especialmente en repos privados)
permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false  # Si falla una plataforma, las demás siguen
      matrix:
        include:
          # Linux es el más barato (1x)
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          # Windows cuesta 2x
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
          # macOS cuesta 10x por minuto de runner.
          # Genera un universal binary (.dmg) que corre en Intel y Apple Silicon.
          # Comentalo si preferís compilar el .dmg manualmente desde tu Mac.
          # - platform: macos-latest
          #  target: universal-apple-darwin

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Solo Linux necesita paquetes extra del sistema
      - name: Install system dependencies (Ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'  # Cache de node_modules para builds más rápidos

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # universal-apple-darwin requiere ambos targets instalados
          targets: ${{ matrix.target == 'universal-apple-darwin' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}

      # Cache de la compilación de Rust (ahorra ~5-10 min por build)
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install dependencies
        run: npm ci && npm run install:all

      # El action oficial de Tauri se encarga de:
      # 1. Build del frontend (vite build)
      # 2. Build del sidecar
      # 3. Compilar Tauri
      # 4. Crear la Release en GitHub con los instaladores
      - name: Build and Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'SrvFiles ${{ github.ref_name }}'
          body: 'Descargá el instalador para tu plataforma.'
          draft: false
          prerelease: false
